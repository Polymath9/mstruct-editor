name: macOS standalone

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: Architecture to build
        type: choice
        options: [both, arm64, x64]
        default: both

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}-${{ inputs.architecture || 'both' }}
  cancel-in-progress: false

jobs:
  build:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.architecture == 'arm64' && '["arm64"]' || inputs.architecture == 'x64' && '["x64"]' || '["arm64","x64"]') }}
    runs-on: ${{ matrix.arch == 'arm64' && 'macos-26' || 'macos-15-intel' }}
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      EXPECTED_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - name: Check native architecture
        run: node -e 'if (process.platform !== "darwin" || process.arch !== process.env.EXPECTED_ARCH) process.exit(1)'
      - run: npm ci
      - name: Restore video encoder cache
        id: encoder-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: desktop/assets/video-encoder
          key: ffmpeg-${{ matrix.arch == 'arm64' && 'macos-26' || 'macos-15' }}-${{ matrix.arch }}-${{ hashFiles('scripts/prepare-video-encoder-mac.mjs') }}
      - name: Prepare offline assets and native FFmpeg
        run: npm run desktop:prepare
      - name: Cache verified video encoder
        if: steps.encoder-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: desktop/assets/video-encoder
          key: ffmpeg-${{ matrix.arch == 'arm64' && 'macos-26' || 'macos-15' }}-${{ matrix.arch }}-${{ hashFiles('scripts/prepare-video-encoder-mac.mjs') }}
      - run: npm test
      - name: Build ZIP package
        run: npm run desktop:dist:mac
      - name: Verify packaged app, signature and MP4 encoding
        run: node scripts/verify-mac-package.mjs
      - name: Upload verified packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MStruct-mac-${{ matrix.arch }}-${{ github.sha }}
          path: |
            release/MStruct-Analysis-Editor-*-mac-${{ matrix.arch }}.zip
            release/MStruct-Analysis-Editor-*-mac-${{ matrix.arch }}.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
